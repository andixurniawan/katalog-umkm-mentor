<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sedang offline</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8faf8; color: #1b2420; }
    main { max-width: 22rem; padding: 1.5rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #55655d; line-height: 1.5; }
    button { margin-top: 1rem; padding: .7rem 1.2rem; border: 0; border-radius: .6rem; background: #1f6b4f; color: #fff; font-weight: 600; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Kamu sedang offline</h1>
    <p>Katalog butuh koneksi internet untuk menampilkan produk terbaru. Periksa sambunganmu lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
